<!doctype html><html><head><meta charset="utf-8"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700..900&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;padding:20px;background:var(--surface);color:var(--ink);font-family:var(--font-sans)}.g{display:grid;gap:16px}.lab{font-family:var(--font-display);font-weight:800;font-size:11px;letter-spacing:.12em;text-transform:uppercase;margin:8px 0 0}.lab b{color:var(--action)}</style><style></style></head><body><div id="root"></div><script>
var B=window.Blits,h=React.createElement;

</script></body></html>
